<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LAN Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0b0c0f;
      --surface:   #111318;
      --border:    #1e2028;
      --accent:    #00ff9d;
      --accent2:   #00c8ff;
      --danger:    #ff4d6d;
      --warn:      #ffd166;
      --muted:     #484d5e;
      --text:      #cdd6f4;
      --subtext:   #6c7086;
      --self-bg:   rgba(0, 255, 157, 0.07);
      --join-color:#00ff9d;
      --left-color:#ff4d6d;
      --radius:    10px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      overflow: hidden;
    }

    /* Subtle noise texture overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
      opacity: 0.3;
    }

    .app {
      display: grid;
      grid-template-columns: 260px 1fr;
      grid-template-rows: 56px 1fr 72px;
      height: 100vh;
      gap: 0;
    }

    /* ── HEADER ─────────────────────────────────── */
    header {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: relative;
    }

    header::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.4;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.5px;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: pulse-dot 2s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--accent); }
      50%       { opacity: 0.5; box-shadow: 0 0 2px var(--accent); }
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 12px;
      color: var(--subtext);
    }

    .my-username {
      color: var(--accent);
      font-weight: 500;
    }

    .online-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0,255,157,0.08);
      border: 1px solid rgba(0,255,157,0.2);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      color: var(--accent);
    }

    /* ── SIDEBAR ─────────────────────────────────── */
    .sidebar {
      border-right: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 16px 20px 12px;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }

    .user-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .user-list::-webkit-scrollbar { width: 4px; }
    .user-list::-webkit-scrollbar-track { background: transparent; }
    .user-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .user-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 20px;
      font-size: 12px;
      color: var(--subtext);
      transition: background 0.15s, color 0.15s;
      animation: slide-in 0.3s ease;
    }

    .user-item.is-me {
      color: var(--accent);
    }

    .user-item:hover {
      background: rgba(255,255,255,0.03);
      color: var(--text);
    }

    .user-avatar {
      width: 28px; height: 28px;
      border-radius: 8px;
      background: var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .user-item.is-me .user-avatar {
      background: rgba(0,255,157,0.15);
      color: var(--accent);
      border: 1px solid rgba(0,255,157,0.3);
    }

    /* ── CHAT AREA ───────────────────────────────── */
    .chat-area {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .msg {
      display: flex;
      flex-direction: column;
      max-width: 680px;
      animation: msg-in 0.2s ease;
    }

    .msg.self { align-self: flex-end; align-items: flex-end; }
    .msg.other { align-self: flex-start; }

    @keyframes msg-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-meta {
      font-size: 10px;
      color: var(--subtext);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .msg.self .msg-meta { flex-direction: row-reverse; }

    .msg-sender { color: var(--accent2); font-weight: 500; }
    .msg.self .msg-sender { color: var(--accent); }

    .msg-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 13px;
      line-height: 1.6;
      color: var(--text);
      word-break: break-word;
      max-width: 100%;
    }

    .msg.self .msg-bubble {
      background: var(--self-bg);
      border-color: rgba(0,255,157,0.2);
    }

    /* System messages */
    .msg-system {
      align-self: center;
      font-size: 11px;
      color: var(--muted);
      padding: 4px 14px;
      text-align: center;
      animation: msg-in 0.2s ease;
    }

    .msg-system.join { color: var(--join-color); opacity: 0.7; }
    .msg-system.left { color: var(--left-color); opacity: 0.7; }

    /* Typing indicator */
    .typing-indicator {
      padding: 0 24px 8px;
      font-size: 11px;
      color: var(--muted);
      height: 22px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: opacity 0.2s;
    }

    .typing-dots {
      display: flex; gap: 3px;
    }

    .typing-dots span {
      width: 4px; height: 4px;
      background: var(--muted);
      border-radius: 50%;
      animation: typing-bounce 1.2s infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing-bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%            { transform: translateY(-4px); }
    }

    /* ── INPUT BAR ───────────────────────────────── */
    .input-bar {
      grid-column: 2;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .input-bar input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-bar input::placeholder { color: var(--muted); }

    .input-bar input:focus {
      border-color: rgba(0,255,157,0.4);
      box-shadow: 0 0 0 3px rgba(0,255,157,0.06);
    }

    .send-btn {
      width: 42px; height: 42px;
      border-radius: var(--radius);
      border: 1px solid rgba(0,255,157,0.3);
      background: rgba(0,255,157,0.08);
      color: var(--accent);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, transform 0.1s;
      flex-shrink: 0;
    }

    .send-btn:hover {
      background: rgba(0,255,157,0.18);
    }

    .send-btn:active { transform: scale(0.93); }

    .send-btn svg { width: 18px; height: 18px; }

    @keyframes slide-in {
      from { opacity: 0; transform: translateX(-8px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* Welcome screen */
    #welcome-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      flex-direction: column;
      gap: 16px;
    }

    .welcome-logo {
      font-family: 'Syne', sans-serif;
      font-size: 36px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -1px;
    }

    .welcome-sub {
      font-size: 13px;
      color: var(--subtext);
    }

    .connecting-dots {
      display: flex; gap: 6px;
    }

    .connecting-dots span {
      width: 6px; height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: typing-bounce 1.2s infinite;
    }

    .connecting-dots span:nth-child(2) { animation-delay: 0.2s; }
    .connecting-dots span:nth-child(3) { animation-delay: 0.4s; }
  </style>
</head>
<body>

<!-- Welcome/connecting screen -->
<div id="welcome-screen">
  <div class="welcome-logo">// LAN CHAT</div>
  <div class="welcome-sub">connecting to server</div>
  <div class="connecting-dots">
    <span></span><span></span><span></span>
  </div>
</div>

<div class="app">
  <!-- Header -->
  <header>
    <div class="logo">
      <div class="logo-dot"></div>
      // LAN CHAT
    </div>
    <div class="header-right">
      <span>you are <span class="my-username" id="my-username">...</span></span>
      <div class="online-badge">
        <svg width="6" height="6" viewBox="0 0 6 6"><circle cx="3" cy="3" r="3" fill="currentColor"/></svg>
        <span id="online-count">0</span> online
      </div>
    </div>
  </header>

  <!-- Sidebar: User List -->
  <aside class="sidebar">
    <div class="sidebar-header">Online Users</div>
    <div class="user-list" id="user-list"></div>
  </aside>

  <!-- Chat -->
  <main class="chat-area">
    <div class="messages" id="messages"></div>
    <div class="typing-indicator" id="typing-indicator" style="opacity:0"></div>
  </main>

  <!-- Input -->
  <div class="input-bar">
    <input
      type="text"
      id="msg-input"
      placeholder="Type a message..."
      maxlength="500"
      autocomplete="off"
    />
    <button class="send-btn" id="send-btn" title="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();

  let myUsername = null;
  let typingTimeout = null;
  let isTyping = false;
  const typingUsers = new Set();

  const messagesEl   = document.getElementById('messages');
  const inputEl      = document.getElementById('msg-input');
  const sendBtn      = document.getElementById('send-btn');
  const userListEl   = document.getElementById('user-list');
  const usernameEl   = document.getElementById('my-username');
  const onlineCount  = document.getElementById('online-count');
  const typingEl     = document.getElementById('typing-indicator');
  const welcomeEl    = document.getElementById('welcome-screen');

  // ── Socket Events ────────────────────────────────────────

  socket.on('connect', () => {
    setTimeout(() => {
      welcomeEl.style.transition = 'opacity 0.4s';
      welcomeEl.style.opacity = '0';
      setTimeout(() => welcomeEl.remove(), 400);
    }, 600);
  });

  socket.on('assigned-username', (name) => {
    myUsername = name;
    usernameEl.textContent = name;
  });

  socket.on('message', ({ username, message, time }) => {
    appendMessage(username, message, time, username === myUsername);
  });

  socket.on('user-joined', ({ message, time, onlineCount: count }) => {
    appendSystem(message, time, 'join');
    onlineCount.textContent = count;
  });

  socket.on('user-left', ({ message, time, onlineCount: count }) => {
    appendSystem(message, time, 'left');
    onlineCount.textContent = count;
    typingUsers.delete(message.split(' ')[0]); // cleanup typing
    updateTypingIndicator();
  });

  socket.on('user-list', (users) => {
    onlineCount.textContent = users.length;
    userListEl.innerHTML = '';
    users.forEach(name => {
      const item = document.createElement('div');
      item.className = 'user-item' + (name === myUsername ? ' is-me' : '');
      const initial = name.charAt(0).toUpperCase();
      item.innerHTML = `
        <div class="user-avatar">${initial}</div>
        <span>${name}${name === myUsername ? ' (you)' : ''}</span>
      `;
      userListEl.appendChild(item);
    });
  });

  socket.on('typing', (username) => {
    typingUsers.add(username);
    updateTypingIndicator();
  });

  socket.on('stop-typing', (username) => {
    typingUsers.delete(username);
    updateTypingIndicator();
  });

  socket.on('disconnect', () => {
    appendSystem('Disconnected from server. Reconnecting...', '', 'left');
  });

  // ── Typing Logic ─────────────────────────────────────────

  function updateTypingIndicator() {
    const users = Array.from(typingUsers);
    if (users.length === 0) {
      typingEl.style.opacity = '0';
      typingEl.innerHTML = '';
      return;
    }
    const label = users.length === 1
      ? `${users[0]} is typing`
      : users.length === 2
        ? `${users[0]} and ${users[1]} are typing`
        : `${users.length} people are typing`;

    typingEl.innerHTML = `
      <div class="typing-dots"><span></span><span></span><span></span></div>
      <span>${label}</span>
    `;
    typingEl.style.opacity = '1';
  }

  inputEl.addEventListener('input', () => {
    if (!isTyping) {
      isTyping = true;
      socket.emit('typing');
    }
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => {
      isTyping = false;
      socket.emit('stop-typing');
    }, 1500);
  });

  // ── Send Message ──────────────────────────────────────────

  function sendMessage() {
    const msg = inputEl.value.trim();
    if (!msg) return;
    socket.emit('message', msg);
    inputEl.value = '';
    if (isTyping) {
      isTyping = false;
      clearTimeout(typingTimeout);
      socket.emit('stop-typing');
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // ── DOM Helpers ───────────────────────────────────────────

  function appendMessage(username, message, time, isSelf) {
    const div = document.createElement('div');
    div.className = 'msg ' + (isSelf ? 'self' : 'other');
    div.innerHTML = `
      <div class="msg-meta">
        <span class="msg-sender">${escapeHtml(username)}</span>
        <span>${time}</span>
      </div>
      <div class="msg-bubble">${escapeHtml(message)}</div>
    `;
    messagesEl.appendChild(div);
    scrollToBottom();
  }

  function appendSystem(message, time, type) {
    const div = document.createElement('div');
    div.className = 'msg-system ' + type;
    div.textContent = time ? `${message} · ${time}` : message;
    messagesEl.appendChild(div);
    scrollToBottom();
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }
</script>
</body>
</html>
